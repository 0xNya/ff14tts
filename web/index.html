<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TextToTalk -> VOICEVOX Bridge</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1e1e2e;color:#cdd6f4;min-height:100vh;display:flex;justify-content:center;align-items:center}
.app{background:#313244;border-radius:12px;width:560px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.tabs{display:flex;background:#45475a}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border:none;background:transparent;color:#a6adc8;font-size:14px;font-weight:600;transition:all .2s}
.tab:hover{background:#585b70;color:#cdd6f4}
.tab.active{background:#313244;color:#89b4fa;border-bottom:2px solid #89b4fa}
.tab-content{display:none;padding:20px}
.tab-content.active{display:block}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:600;color:#a6adc8;margin-bottom:6px}
.field select{width:100%;padding:8px 12px;border:1px solid #585b70;border-radius:8px;background:#45475a;color:#cdd6f4;font-size:14px;cursor:pointer;outline:none}
.field select:focus{border-color:#89b4fa}
.field select option{background:#313244;color:#cdd6f4}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type="range"]{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:#585b70;border-radius:3px;outline:none;cursor:pointer}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#89b4fa;cursor:pointer;transition:transform .15s}
.slider-row input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider-row input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#89b4fa;cursor:pointer;border:none}
.slider-value{min-width:44px;text-align:right;font-size:14px;font-weight:600;color:#89b4fa;font-variant-numeric:tabular-nums}
.bottom-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #45475a;gap:12px}
.btn{background:#89b4fa;color:#1e1e2e;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
.btn:hover{background:#b4d0fb}
.btn:active{transform:scale(.97)}
.status{font-size:13px;color:#a6adc8;flex:1;text-align:right}
.status.error{color:#f38ba8}
.status.success{color:#a6e3a1}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="male">Male</button>
    <button class="tab" data-cat="female">Female</button>
    <button class="tab" data-cat="unknown">Unknown</button>
  </div>
  <div id="male" class="tab-content active"></div>
  <div id="female" class="tab-content"></div>
  <div id="unknown" class="tab-content"></div>
  <div class="bottom-bar">
    <button class="btn" id="refreshBtn">Refresh voices</button>
    <span class="status" id="status">Ready</span>
  </div>
</div>
<script>
const CATEGORIES = ['male','female','unknown'];
let config = null;
let voices = [];
let dirty = {};

function qs(s, p){return(p||document).querySelector(s)}
function qsa(s, p){return[...(p||document).querySelectorAll(s)]}

function setStatus(text, type){
  const el=document.getElementById('status');
  el.textContent=text;
  el.className='status'+(type?' '+type:'');
}

async function api(path, opts){
  const r=await fetch(path, opts);
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

async function loadConfig(){
  config=await api('/api/config');
  CATEGORIES.forEach(c=>{
    if(!dirty[c])dirty[c]={voice:false,speed:false,volume:false};
  });
}

async function loadVoices(){
  try{
    const v=await api('/api/voices');
    voices=v;
    CATEGORIES.forEach(renderCategory);
    setStatus('Voices loaded','success');
  }catch(e){
    setStatus('Failed to fetch voices','error');
  }
  applyConfigToUI();
}

async function saveConfig(){
  try{
    await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});
  }catch(e){
    console.error('Save config error:',e);
  }
}

function renderCategory(cat){
  const container=document.getElementById(cat);
  if(!container)return;
  container.innerHTML='';
  const selOpts=voices.map(v=>`<option value="${v.display.replace(/"/g,'&quot;')}">${v.display}</option>`).join('');
  container.innerHTML=`
    <div class="field">
      <label for="${cat}-voice">Voice:</label>
      <select id="${cat}-voice" data-cat="${cat}">${selOpts}</select>
    </div>
    <div class="field">
      <label for="${cat}-speed">Speed:</label>
      <div class="slider-row">
        <input type="range" id="${cat}-speed" data-cat="${cat}" min="0.5" max="2.0" step="0.01" value="1.0">
        <span class="slider-value" id="${cat}-speed-val">1.00</span>
      </div>
    </div>
    <div class="field">
      <label for="${cat}-volume">Volume:</label>
      <div class="slider-row">
        <input type="range" id="${cat}-volume" data-cat="${cat}" min="0.0" max="2.0" step="0.01" value="1.0">
        <span class="slider-value" id="${cat}-volume-val">1.00</span>
      </div>
    </div>
  `;
  document.getElementById(`${cat}-voice`).addEventListener('change',()=>onVoiceChange(cat));
  document.getElementById(`${cat}-speed`).addEventListener('input',()=>onSliderChange(cat,'speed'));
  document.getElementById(`${cat}-volume`).addEventListener('input',()=>onSliderChange(cat,'volume'));
}

function applyConfigToUI(){
  if(!config)return;
  CATEGORIES.forEach(cat=>{
    const c=config[cat];
    if(!c)return;
    const sel=document.getElementById(`${cat}-voice`);
    const spd=document.getElementById(`${cat}-speed`);
    const vol=document.getElementById(`${cat}-volume`);
    if(sel&&c.voice_display){
      const idx=[...sel.options].findIndex(o=>o.value===c.voice_display);
      if(idx>=0)sel.selectedIndex=idx;
    }
    if(spd){
      spd.value=c.speed;
      const v=document.getElementById(`${cat}-speed-val`);
      if(v)v.textContent=c.speed.toFixed(2);
    }
    if(vol){
      vol.value=c.volume;
      const v=document.getElementById(`${cat}-volume-val`);
      if(v)v.textContent=c.volume.toFixed(2);
    }
  });
}

function onVoiceChange(cat){
  const sel=document.getElementById(`${cat}-voice`);
  if(!sel||!config||!config[cat])return;
  const display=sel.value;
  config[cat].voice_display=display;
  dirty[cat].voice=true;
  saveConfig();
}

function onSliderChange(cat,field){
  const el=document.getElementById(`${cat}-${field}`);
  const valEl=document.getElementById(`${cat}-${field}-val`);
  const val=parseFloat(el.value);
  if(valEl)valEl.textContent=val.toFixed(2);
  if(config&&config[cat]){
    config[cat][field]=val;
    dirty[cat][field]=true;
  }
}

// Debounced save on slider release
function saveOnRelease(cat){
  return function(){
    if(config&&config[cat])saveConfig();
  };
}

// Tab switching
document.getElementById('tabs').addEventListener('click',e=>{
  const btn=e.target.closest('.tab');
  if(!btn)return;
  qsa('.tab').forEach(t=>t.classList.remove('active'));
  qsa('.tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.cat).classList.add('active');
});

// Refresh
document.getElementById('refreshBtn').addEventListener('click',async()=>{
  setStatus('Fetching voices...');
  await loadVoices();
});

// Init slider release handlers
document.addEventListener('change',e=>{
  if(e.target.matches('input[type="range"]')){
    const cat=e.target.dataset.cat;
    if(cat)saveConfig();
  }
});

async function init(){
  try{
    await loadConfig();
    await loadVoices();
  }catch(e){
    setStatus('Error loading config','error');
    console.error(e);
  }
  // Poll status from server
  setInterval(async()=>{
    try{
      const st=await api('/api/status');
      setStatus(st.text,st.type||'');
    }catch(_){}
  },3000);
}

init();
</script>
</body>
</html>
